<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>菊水楼 屋内マップ（スマホ最適化）</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

  <style>
    :root{
      --popup-max-width: 320px;
      --popup-font: 15px;
    }
    html,body{height:100%;margin:0;font-family:"Noto Sans JP","Hiragino Sans",system-ui,Arial,sans-serif;background:#fff;}
    #map{height:100vh;width:100%;}

    /* 言語切替ボタン */
    #langToggle{
      position:fixed;
      top:12px;
      right:12px;
      z-index:14000;
      background:rgba(255,255,255,0.95);
      border:1px solid #d0d0d0;
      padding:8px 10px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      cursor:pointer;
      font-size:14px;
    }

    /* ポップアップ内（Leafletの標準popup内で使う） */
    .popup-content{ max-width:var(--popup-max-width); font-size:var(--popup-font); line-height:1.5; }
    .popup-content h3{ margin:0 0 6px 0; font-size:1.05em; color:#222; }
    .popup-desc{ margin-top:6px; color:#333; }

    /* Swiper 見た目 */
    .swiper{ width:260px; height:180px; margin-bottom:8px; }
    .swiper .swiper-slide img{ width:100%; height:100%; object-fit:cover; border-radius:8px; cursor:pointer; display:block; }

    .img-hint{ font-size:12px; color:#666; margin-top:6px; text-align:center; }

    /* モーダル（拡大） */
    #imgModal{
      display:none;
      position:fixed;
      z-index:16000;
      inset:0;
      background:rgba(0,0,0,0.85);
      justify-content:center;
      align-items:center;
    }
    #imgModal img{ max-width:94%; max-height:94%; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,0.6); }

    /* トースト通知 */
    #toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:20px;
      background:rgba(0,0,0,0.8);
      color:white;
      padding:10px 16px;
      border-radius:10px;
      z-index:17000;
      display:none;
      font-size:14px;
    }

    /* スマホ最適化 */
    @media (max-width:600px){
      :root{ --popup-max-width:90vw; --popup-font:14px; }
      .swiper{ width:85vw; height:55vw; }
      #langToggle{ padding:7px 9px; font-size:13px; }
      .img-hint{ font-size:12px; }
    }
  </style>
</head>
<body>
  <button id="langToggle" aria-label="Toggle language">EN / 日本語</button>
  <div id="map" role="application" aria-label="Indoor map"></div>

  <!-- 画像拡大モーダル（クリックで閉じる） -->
  <div id="imgModal" onclick="this.style.display='none'">
    <img src="" alt="expanded image" />
  </div>

  <!-- トースト -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  // -------- 言語（自動判定） --------
  let lang = (navigator.language || navigator.userLanguage || 'en').startsWith('ja') ? 'ja' : 'en';

  // -------- マップ初期化 --------
  const mapWidth = 2000;   // 背景画像の実ピクセル幅（必要なら調整）
  const mapHeight = 1500;  // 背景画像の実ピクセル高さ（必要なら調整）
  const bounds = [[0,0],[mapHeight,mapWidth]];

  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 2,
    zoomControl: true,
    tap: true
  });

  L.imageOverlay('kikusui_map.png', bounds).addTo(map);
  map.fitBounds(bounds);

  // -------- データ（日本語/英語） --------
  const rooms = [
    {
      name: { ja: "玄関", en: "Entrance" },
      coords: [1150,1010],
      desc: {
        ja: "ようこそ菊水楼へ。玄関横に貼られている逆さ向きの札には大泥棒・石川五右衛門の命日が書かれており、これは泥棒除けとされています。",
        en: "Welcome to Kikusuiro. The upside-down plaque near the entrance bears the death date of Ishikawa Goemon, believed to ward off burglars."
      },
      img: ["IMG_0377.jpeg"]
    },
    {
      name: { ja: "下広間", en: "Lower Hall" },
      coords: [1050,950],
      desc: {
        ja: "鹿の彫刻や正面の壁に飾られている書道が特徴的です。東側の棚には菊水楼で結婚式を挙げた方々が作る「結」という巻物が飾られています。",
        en: "This room features a deer sculpture and calligraphy on the front wall. On the east shelf you can see 'Yui' scrolls created by couples married at Kikusuiro."
      },
      img: ["IMG_0378.jpeg","IMG_0379.jpeg","IMG_0376.jpeg","IMG_0380.jpeg"]
    },
    {
      name: { ja: "オリエンタルルーム", en: "Oriental Room" },
      coords: [850,300],
      desc: {
        ja: "宴会・披露宴に使用されます。中華風の照明や銅鑼、ビリヤード台など様々な文化が混合している内装が特徴的です。",
        en: "Used for banquets and receptions. Its décor mixes cultures with Chinese-style lamps, a gong, and a billiard table."
      },
      img: ["IMG_0382.jpeg"]
    },
    {
      name: { ja: "春日の間", en: "Kasuga Room" },
      coords: [700,1575],
      desc: {
        ja: "この部屋の中央部西側の壁にある柱は明治維新後の廃仏毀釈運動の時に寺から引き取ったものです。",
        en: "The pillar on the west wall was brought from a temple during the anti-Buddhist movement after the Meiji Restoration."
      },
      img: ["IMG_0381.jpeg"]
    }
  ];

  // -------- Swiperインスタンス管理 --------
  const swipers = {}; // key: swiperClass -> Swiper instance

  // 安全にSwiperを初期化する関数
  function initSwiperForClass(swiperClass) {
    // destroy existing
    const el = document.querySelector(`.${swiperClass}`);
    if (!el) return;
    if (el.swiper) {
      try { el.swiper.destroy(true, true); } catch(e){ /* ignore */ }
    }
    // initialize with scoped selectors
    return new Swiper(`.${swiperClass}`, {
      pagination: { el: `.${swiperClass} .swiper-pagination`, clickable: true },
      navigation: {
        nextEl: `.${swiperClass} .swiper-button-next`,
        prevEl: `.${swiperClass} .swiper-button-prev`
      },
      observer: true,
      observeParents: true
    });
  }

  // -------- モーダル（拡大） --------
  function openModal(src){
    const m = document.getElementById('imgModal');
    const img = m.querySelector('img');
    img.src = src;
    m.style.display = 'flex';
  }

  // トースト表示
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=>{ t.style.display = 'none'; }, 1600);
  }

  // -------- 安定的に何度でも開けるポップアップ処理 --------
  let markers = [];

  function makePopupHTML(room, idx){
    // unique class for scoping
    const sc = `room-swiper-${idx}`;
    const imagesHtml = (room.img && room.img.length)
      ? room.img.map(src => `<div class="swiper-slide"><img src="${src}" alt="${room.name[lang]}" onclick="openModal('${src}')"></div>`).join('')
      : `<div style="font-size:13px;color:#666">No image</div>`;

    return `
      <div class="popup-content">
        <h3>${room.name[lang]}</h3>
        <div class="swiper ${sc}">
          <div class="swiper-wrapper">
            ${imagesHtml}
          </div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
        <div class="img-hint">${lang === 'ja' ? '📷 画像をタップすると拡大表示されます' : '📷 Tap an image to enlarge'}</div>
        <div class="popup-desc">${room.desc[lang]}</div>
      </div>
    `;
  }

  function clearMarkers(){
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function addMarkers(){
    clearMarkers();
    rooms.forEach((room, i) => {
      const marker = L.marker(room.coords).addTo(map);
      markers.push(marker);

      // bind empty popup once for stability
      marker.bindPopup('', { maxWidth: 420, className: 'custom-popup' });

      marker.on('click', () => {
        // set content (do not re-bind new Popup object)
        marker.setPopupContent(makePopupHTML(room, i));
        marker.openPopup();

        // give browser a tick to render popup DOM, then init swiper for this popup only
        setTimeout(()=> {
          const sc = `room-swiper-${i}`;
          // destroy any previous swiper on the element then init
          if (swipers[sc]) {
            try { swipers[sc].destroy(true, true); } catch(e) {}
            delete swipers[sc];
          }
          swipers[sc] = initSwiperForClass(sc);
        }, 80);
      });
    });
  }

  // 初期マーカー追加
  addMarkers();

  // -------- 言語切替（自動＋手動） --------
  const btn = document.getElementById('langToggle');
  btn.addEventListener('click', () => {
    lang = (lang === 'ja') ? 'en' : 'ja';
    // close popups to avoid stale content during refresh
    map.closePopup();
    // update popups content for markers (we keep same markers but update content when clicked next)
    // To make existing open popups update immediately, we refresh markers then optionally show nothing open.
    addMarkers();
    showToast(lang === 'ja' ? '日本語表示に切り替えました' : 'Switched to English');
  });

  // Ensure popups re-layout on resize / orientation change
  window.addEventListener('resize', ()=> {
    map.invalidateSize();
    map.fitBounds(bounds);
  });

  // Accessibility: close modal via Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const m = document.getElementById('imgModal');
      if (m.style.display === 'flex') m.style.display = 'none';
    }
  });

  // Prevent interfering pointer events when modal open
  document.getElementById('imgModal').addEventListener('click', function(e){
    if (e.target === this) this.style.display = 'none';
  });

  </script>
</body>
</html>
